<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<script>try{if(localStorage.getItem("pp-mode")==="dark")document.documentElement.dataset.mode="dark"}catch(e){}</script>
<title>Pinpoint – Country Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bezel:#1c2638;--bg:#f6f8fb;--sea:#dce8f6;--land:#fff;--ctx:#c6d3e3;--region:#91acd0;--line:#000000;--card:#fff;--bd:#e2e8f1;--tx:#0f1a2b;--mu:#5a6b83;--soft:#eef2f8;--acc:#2f6bff;--ok:#16a34a;--bad:#e5484d;--warn:#f5a524;--found:#7fdba4;--sh:0 1px 2px rgba(15,26,43,.06),0 4px 14px rgba(15,26,43,.08);box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
:root[data-mode=dark]{color-scheme:dark;--bezel:#4a5b7a;--bg:#0b1220;--sea:#0e1a2d;--land:#6a84ae;--ctx:#1d2d47;--region:#405b82;--line:#ffffff;--card:#142033;--bd:#25344d;--tx:#e9eefa;--mu:#93a3bd;--soft:#1b2a42;--found:#46c88c;--acc:#4f86ff;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--card);color:var(--tx);font:400 15px/1.35 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card)}
.ib{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.t{flex:1;min-width:0}.t b{display:block;font-size:16px;font-weight:700;line-height:1.2}.t span{font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.chip{display:flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:99px;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.chip .i{width:14px;height:14px}
#snd.off .on,#snd:not(.off) .of{display:none}
#bar{height:3px;background:var(--bd)}#fill{display:block;height:100%;width:0;background:var(--acc);transition:width .55s cubic-bezier(.2,.8,.2,1)}
#ask{margin:12px 16px 0;padding:10px 16px;background:var(--card);border:1px solid var(--bd);border-radius:16px;text-align:center;box-shadow:var(--sh);position:relative;z-index:1}
.cap{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
#name{display:block;font-size:clamp(24px,7vw,32px);font-weight:700;letter-spacing:-.015em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:1;min-height:0;position:relative;margin-top:-22px;background:var(--sea);border-top:1px solid var(--bd)}
#map{display:block;width:100%;height:100%;touch-action:none}
#g{transform-origin:0 0}
#g path{fill:transparent;stroke:var(--line);stroke-width:.55;vector-effect:non-scaling-stroke;transition:fill .3s,stroke .25s,stroke-width .25s}
#g path.x{fill:var(--ctx);stroke:var(--line);pointer-events:none}
#g .m{fill:transparent;stroke:var(--line);stroke-width:1.3;vector-effect:non-scaling-stroke;pointer-events:all;cursor:pointer;transition:stroke .25s,stroke-width .25s}
#g .m.bad{fill:transparent!important;stroke:var(--bad)!important;stroke-width:3.5!important}
#g .bad{fill:color-mix(in srgb,var(--bad) 78%,transparent)!important;stroke:var(--bad)!important;stroke-width:1.5!important}
@keyframes pu{50%{stroke:var(--bad)}}#g .pu{animation:pu .6s 3}
@keyframes rg{0%{transform:scale(.18);opacity:0}8%{opacity:.95}100%{transform:scale(1.45);opacity:0}}
#g .ring{fill:none;stroke:var(--acc);stroke-width:4;vector-effect:non-scaling-stroke;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:rg 2.35s cubic-bezier(.16,1,.3,1) forwards}
@keyframes sh{0%{background:var(--bad);color:#fff;border-color:var(--bad)}15%{transform:translateX(-8px)}35%{transform:translateX(8px)}55%{transform:translateX(-5px)}75%{transform:translateX(3px)}100%{transform:none}}
@keyframes gd{0%,40%{background:var(--ok);color:#fff;border-color:var(--ok)}}
#ask.sh{animation:sh .38s}#ask.gd{animation:gd .45s}
#toast{position:absolute;left:50%;bottom:14px;padding:9px 16px;border-radius:99px;background:var(--tx);color:var(--card);opacity:0;transform:translate(-50%,10px) scale(.96);transition:opacity .22s,transform .3s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;white-space:nowrap;font-weight:600;font-size:14px;box-shadow:var(--sh)}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}#toast.ok{background:var(--ok);color:#fff}#toast.bad{background:var(--bad);color:#fff}
#dock{display:flex;gap:8px;padding:10px 16px 12px;background:var(--card);border-top:1px solid var(--bd)}
#dock button{height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;background:var(--soft)}
#hint{flex:1}#skip{flex:1.4;background:var(--acc)!important;color:#fff}#fit{width:48px}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,16,32,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:opacity .25s}
.ov.hide{opacity:0;pointer-events:none}
.card{width:min(520px,100%);max-height:92%;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 40px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.ov.hide .card{transform:translateY(48px) scale(.97)}
.card::before{content:'';display:block;width:40px;height:4px;border-radius:9px;background:var(--bd);margin:6px auto 14px}
@media(min-width:600px){.ov{align-items:center}.card{border-radius:24px}}
.card h1,.card h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}.card p{margin:4px 0 14px;color:var(--mu);font-size:14px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:10px 12px;border-radius:14px;text-align:left;border:1px solid transparent}
.row:hover{background:var(--soft)}
.tile{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--acc)}
.row.feat{border-color:var(--bd);background:var(--soft);margin-bottom:6px}.feat .tile{background:var(--acc);color:#fff}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:16px;font-weight:600}.rt small{color:var(--mu);font-size:13px}
.row .i{color:var(--mu)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:48px;margin-top:8px;border-radius:12px;font-weight:600;font-size:15px}
.pri{background:var(--acc);color:#fff}.sec{background:var(--soft)}.gh{color:var(--mu)}
#end .card{text-align:center}
#pct{--p:0;width:128px;height:128px;margin:14px auto 0;border-radius:50%;position:relative;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--soft) 0)}
#pct::before{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--card)}
#pct span{position:relative;font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}.stats div{background:var(--soft);border-radius:12px;padding:10px 4px}.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.stats span{font-size:12px;color:var(--mu)}
.lbl{margin:14px 0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
#missed{max-height:110px;overflow:auto}#missed span{display:inline-block;margin:3px;padding:4px 10px;border-radius:99px;border:1px solid var(--bd);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.mh p{margin:4px 0 12px}
:root[data-mode=dark] #theme .mo,:root:not([data-mode=dark]) #theme .su{display:none}
.pcs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;margin:0 -20px;padding:4px 20px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.pcs::-webkit-scrollbar{display:none}
.pc{flex:0 0 min(46%,176px);aspect-ratio:9/16;scroll-snap-align:start;display:flex;flex-direction:column;border-radius:30px;border:5px solid var(--bezel);background:var(--sea);overflow:hidden;position:relative;text-align:left;box-shadow:var(--sh)}
.pc::before{content:'';position:absolute;top:7px;left:50%;width:34%;height:9px;margin-left:-17%;border-radius:9px;background:var(--bezel);z-index:1}
.shape{flex:1;min-height:0;padding:24px 6px 0;display:flex}.shape svg{width:100%;height:100%}
.shape path{fill:var(--acc);stroke:var(--sea);stroke-width:.4}.shape .sph{fill:color-mix(in srgb,var(--acc) 14%,var(--sea));stroke:none}
.pi{padding:10px 12px 14px;background:var(--card)}.pi b{display:block;font-size:16px;font-weight:700;line-height:1.2}.pi small{display:block;color:var(--mu);font-size:12px}.pi .bs{color:var(--acc);font-weight:600}
#g .lb{font-weight:600;fill:#052e1a;stroke:rgba(255,255,255,.75);paint-order:stroke;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none;opacity:0;transition:opacity .25s}#g .lb.on{opacity:1}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
button{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .2s,opacity .2s}
button:active{transform:scale(.96)}
body,#hud,#ask,#dock,#stage,.pi{transition:background-color .35s,color .35s,border-color .35s}
.ov{transition:opacity .28s ease,visibility 0s}.ov.hide{visibility:hidden;transition:opacity .28s ease,visibility 0s .28s}
.card{transition:transform .45s cubic-bezier(.2,.9,.25,1),background-color .35s}
#name.pop{animation:np .38s cubic-bezier(.2,.8,.2,1)}@keyframes np{from{opacity:0;transform:translateY(10px)}}
.bp{display:inline-block;animation:bp .38s cubic-bezier(.2,.8,.2,1)}@keyframes bp{40%{transform:scale(1.35)}}
#ask.gd{animation:gd .5s,gp .5s cubic-bezier(.2,.8,.2,1)}@keyframes gp{40%{transform:scale(1.03)}}
@keyframes fp{0%{stroke-width:6;stroke:#fff}}#g .fp{animation:fp .7s cubic-bezier(.2,.8,.2,1)}
#g .ring.ok{stroke:var(--ok);animation-duration:1.1s}
.rp{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--ok);pointer-events:none;animation:rpl .6s cubic-bezier(.2,.8,.2,1) forwards}.rp.bad{border-color:var(--bad)}
@keyframes rpl{from{transform:scale(.2);opacity:.9}to{transform:scale(1);opacity:0}}
.pc{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;animation:cu .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms + 120ms)}
@keyframes cu{from{opacity:0;transform:translateY(18px) scale(.95)}}
@media(hover:hover){.pc:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(15,26,43,.18)}}
.pc:active{transform:scale(.96)}
#pct{transition:--p 1.1s cubic-bezier(.2,.8,.2,1)}
#end:not(.hide) #ttl{animation:cu .5s .1s cubic-bezier(.2,.8,.2,1) backwards}
#end:not(.hide) .stats div{animation:cu .5s cubic-bezier(.2,.8,.2,1) backwards}
#end:not(.hide) .stats div:nth-child(1){animation-delay:.35s}#end:not(.hide) .stats div:nth-child(2){animation-delay:.45s}#end:not(.hide) .stats div:nth-child(3){animation-delay:.55s}
#theme .i,#snd .i{animation:ts .45s cubic-bezier(.2,.8,.2,1)}@keyframes ts{from{opacity:0;transform:rotate(-90deg) scale(.5)}}
:root{--m0:#f2a08a;--m1:#f4a0c0;--m2:#d99be0;--m3:#b9a4f2;--m4:#9aa8f0;--m5:#8fb8ff;--m6:#86d0f2;--m7:#7fd3d8;--m8:#e8cf8e;--m9:#f6bd8b;--m10:#cfa8c0;--m11:#aab8cc}
:root[data-mode=dark]{--m0:#b5604a;--m1:#b8587f;--m2:#9a5aa8;--m3:#7a63c2;--m4:#5a68c0;--m5:#4a76c4;--m6:#3f8fb8;--m7:#3f9aa0;--m8:#a38c4a;--m9:#b07a45;--m10:#8a627c;--m11:#5f7088}
#g path.x{opacity:.38;transition:fill .3s,stroke .25s,opacity .35s}
.tg{margin-top:4px;border-color:var(--bd)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bd);position:relative;flex:none;transition:background-color .25s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.tg[aria-checked=true] .sw{background:var(--acc)}.tg[aria-checked=true] .sw::after{transform:translateX(18px)}
#map.mv #g .lb{opacity:0!important;transition:none}
#map.mv path{shape-rendering:optimizeSpeed;transition:none}
html,body{overscroll-behavior:none}
body{animation:pin .5s ease}@keyframes pin{from{opacity:0}}
#map.in{animation:mi .55s cubic-bezier(.2,.8,.2,1)}@keyframes mi{from{opacity:0;transform:scale(.97)}}
@media(hover:hover){#g path:not(.x){cursor:pointer}#g path:not(.x):hover{stroke-width:1.5}}
#g path.sf{stroke:none}
#g path.bd{fill:none!important;pointer-events:none}
/* ===== Top progress bar ===== */
#app{position:relative}
#bar{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;height:4px;z-index:3;background:color-mix(in srgb,var(--mu) 20%,transparent);pointer-events:none;overflow:hidden}
#fill{display:block;position:relative;height:100%;width:0;border-radius:0 4px 4px 0;background:linear-gradient(90deg,var(--acc),#4cc9f0);transition:width .6s cubic-bezier(.2,.8,.2,1),background .4s}
#fill::after{content:"";position:absolute;right:0;top:0;bottom:0;width:44px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85));opacity:0}
#fill.adv::after{animation:bsh .8s ease-out}
@keyframes bsh{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(18px)}}
#fill.full{background:linear-gradient(90deg,var(--ok),#5eead4)}
/* ===== Bangladesh map ===== */
:root{--dv0:hsl(8,72%,74%);--dv1:hsl(205,72%,72%);--dv2:hsl(46,80%,70%);--dv3:hsl(150,50%,64%);--dv4:hsl(285,48%,78%);--dv5:hsl(26,82%,72%);--dv6:hsl(330,62%,78%);--dv7:hsl(176,52%,62%)}
:root[data-mode=dark]{--dv0:hsl(8,46%,46%);--dv1:hsl(205,46%,44%);--dv2:hsl(46,50%,42%);--dv3:hsl(150,34%,38%);--dv4:hsl(285,32%,48%);--dv5:hsl(26,52%,44%);--dv6:hsl(330,40%,48%);--dv7:hsl(176,36%,38%)}
#g .dv{fill:none;stroke:var(--acc);stroke-width:.9;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none;opacity:0;transition:opacity .25s}
@keyframes dvh{0%,100%{stroke-width:.9}50%{stroke-width:1.6}}
#g .dv.hl{opacity:1;animation:dvh .9s ease-in-out 3}
@keyframes dvd{0%{opacity:1;stroke-width:2.4}100%{opacity:0;stroke-width:.9}}
#g .dv.done{stroke:var(--ok);animation:dvd 1.5s cubic-bezier(.2,.8,.2,1)}
#rgs .m{fill:transparent;stroke:var(--line);stroke-width:1.15;vector-effect:non-scaling-stroke;pointer-events:all;cursor:pointer}
#rgs .m.bad{fill:transparent!important;stroke:var(--bad)!important;stroke-width:3.5!important}
#rgs .pu{animation:pu .6s 3}
#g .rv{fill:var(--rv);stroke:var(--rv);stroke-width:.5;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
:root{--rv:#cfe2f7}:root[data-mode=dark]{--rv:#10233f}
.pc.bdc{border-color:#0b6e4f;animation:cu .5s cubic-bezier(.2,.8,.2,1) backwards,bdg 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0)*45ms + 120ms),calc(var(--i,0)*45ms + 900ms)}
.pc.bdc::before{background:#0b6e4f}
:root[data-mode=dark] .pc.bdc{border-color:#2f9e78}:root[data-mode=dark] .pc.bdc::before{background:#2f9e78}
@keyframes bdg{0%,100%{box-shadow:var(--sh)}50%{box-shadow:0 0 0 5px rgba(11,110,79,.22),var(--sh)}}
.nw{position:absolute;top:13px;right:14px;z-index:2;padding:2px 8px;border-radius:99px;background:#f42a41;color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;box-shadow:0 2px 6px rgba(244,42,65,.35)}
#missed .dd{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:reduce){.pc.bdc{animation:cu .01s backwards}#fill::after{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5zM22 9l-6 6M16 9l6 6"/></symbol>
<symbol id="i-bulb" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4"/></symbol>
<symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zM19 5v14"/></symbol>
<symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol><symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol></defs></svg>
<div id="app">
 <header id="hud">
  <button class="ib" id="menuBtn" aria-label="Choose map"><svg class="i"><use href="#i-menu"/></svg></button>
  <div class="t"><b id="reg">World</b><span><span id="sc">0/0</span> found</span></div>
  <div class="chip" title="Wrong taps" aria-label="Wrong taps"><svg class="i"><use href="#i-x"/></svg><span id="ms">0</span></div>
  <button class="ib" id="snd" aria-label="Toggle sound"><svg class="i on"><use href="#i-vol"/></svg><svg class="i of"><use href="#i-mute"/></svg></button>
 </header>
 <div id="bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div>
 <section id="ask"><span class="cap">Find this country</span><b id="name">–</b></section>
 <main id="stage"><svg id="map"><g id="g"></g></svg><div id="toast"></div></main>
 <footer id="dock"><button id="fit" aria-label="Reset view"><svg class="i"><use href="#i-fit"/></svg></button><button id="hint"><svg class="i"><use href="#i-bulb"/></svg>Hint</button><button id="skip">Skip<svg class="i"><use href="#i-skip"/></svg></button></footer>

function confetti(){if(RM)return;const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9';document.body.appendChild(c);const w=c.width=innerWidth,h=c.height=innerHeight,x=c.getContext('2d'),C=['#2f6bff','#16a34a','#f5a524','#e5484d','#b794f6','#4cc9f0'],ps=Array.from({length:90},()=>({x:w/2,y:h*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:5+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:C[Math.random()*6|0]}));let n=0;(function f(){x.clearRect(0,0,w,h);n++;for(const p of ps){p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-n/110);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}n<110?requestAnimationFrame(f):c.remove()})()}
const SH={};

 if(SH[k])return SH[k];
 if(k==='BD'){const X=170,Y=200,bf=FEATS.filter(f=>META[f.id][2]==='BD'),pr=d3.geoMercator().fitExtent([[16,18],[X-16,Y-12]],{type:'FeatureCollection',features:bf}),pa=d3.geoPath(pr),by=DIVN.map(()=>'');for(const f of bf)by[META[f.id][4]]+=pa(f);return SH[k]=`<svg viewBox="0 0 ${X} ${Y}">${by.map((d,i)=>`<path d="${d}" style="fill:var(--dv${i})"/>`).join('')}</svg>`}
 const r=R[k],X=170,Y=200,wd=k=='world';let pr,cl='';
 if(wd)pr=d3.geoOrthographic().rotate([-25,-15]).fitExtent([[6,6],[X-6,Y-6]],{type:'Sphere'});
 else{const [w,s,e,n]=r.b,m=(w+e)/2,q=(s+n)/2,box={type:'MultiPoint',coordinates:[[w,s],[e,s],[e,n],[w,n],[m,s],[m,n],[w,q],[e,q]]};
  pr=d3.geoMercator().rotate([r.rot||0,0]).fitExtent([[4,4],[X-4,Y-4]],box);const b=d3.geoPath(pr).bounds(box);
  cl=`<clipPath id="c${k}"><rect x="${b[0][0]}" y="${b[0][1]}" width="${b[1][0]-b[0][0]}" height="${b[1][1]-b[0][1]}"/></clipPath>`}
 const pa=d3.geoPath(pr),d=FEATS.filter(f=>r.cont?META[f.id][2]===r.cont:META[f.id][2]!=='BD').map(f=>pa(f)||'').join('');
 return SH[k]=`<svg viewBox="0 0 ${X} ${Y}"><defs>${cl}</defs>${wd?`<path class="sph" d="${pa({type:'Sphere'})}"/>`:''}<path ${wd?'':`clip-path="url(#c${k})" `}d="${d}"/></svg>`}

 $('#res').hidden=!S.Q.length;$('#menu').classList.remove('hide');$('#end').classList.add('hide')}
